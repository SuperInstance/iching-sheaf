[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iching-sheaf"
version = "1.0.0"
description = "The I Ching as a sheaf-theoretic system: hexagram topology, cohomology, category theory, tropical algebra, and persistent homology"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "iching-sheaf contributors"}]
keywords = ["iching", "sheaf", "cohomology", "topology", "category-theory", "tropical-geometry", "persistence"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
